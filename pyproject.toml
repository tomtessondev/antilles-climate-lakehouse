[project]
name = "antilles-climate-lakehouse"
version = "0.1.0"
description = "Climate of Guadeloupe and Martinique from Météo-France daily series: a medallion lakehouse in PySpark and Delta, deployed to Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    # Local runs and tests; on Databricks the serverless environment provides Spark.
    # Same Spark as serverless environment 4 (Spark 4.0, Python 3.12, JDK 17).
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "matplotlib>=3.9",
]

[project.scripts]
antilles-lakehouse = "antilles_lakehouse.jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antilles_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=antilles_lakehouse --cov-report=term-missing"
